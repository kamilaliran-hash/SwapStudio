plugins {
    id 'com.android.application'
}

android {
    namespace 'com.swapstudio.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.swapstudio.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs straight away.
            // Use your own keystore before publishing to Google Play.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
